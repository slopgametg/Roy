<style>
/* Layout: one full-bleed canvas, HUD pinned to corners, touch controls bottom, modal panels centered. Deliberately dark single-theme (dungeon). */
:root{
  --bg:#0c0a0f; --panel:#17121c; --panel2:#221a29; --line:#3b2f45;
  --ink:#ede4d3; --muted:#9b8fa5; --blood:#c8364b; --blood-d:#7d1d2c;
  --soul:#72e3d3; --gold:#efbd4e; --armor:#8fa7c4;
  --display:"Pixelify Sans",ui-monospace,"Courier New",monospace;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--soul);outline-offset:2px}

/* HUD */
#hud{position:absolute;top:8px;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;font-family:var(--display)}
.hl{display:flex;flex-direction:column;gap:5px;min-width:0}
.pl{display:flex;flex-direction:column;gap:3px}
.pl .tag{font-size:11px;color:var(--muted);letter-spacing:.08em}
.bar{position:relative;width:132px;height:13px;background:#000a;border:2px solid #000;box-shadow:inset 0 0 0 1px #ffffff14}
.bar i{position:absolute;inset:0 auto 0 0;display:block;width:100%;transition:width .12s}
.bar.hp i{background:linear-gradient(#e2546a,var(--blood) 60%,var(--blood-d))}
.bar.ar i{background:linear-gradient(#b9cbe2,var(--armor) 60%,#5d7090)}
.bar span{position:relative;display:block;font-size:11px;line-height:9px;text-align:center;color:#fff;text-shadow:1px 1px 0 #000;font-variant-numeric:tabular-nums}
.ab{position:relative;width:132px;height:14px;background:#000a;border:2px solid #000}
.ab i{position:absolute;inset:0 auto 0 0;display:block;background:linear-gradient(#8a64bb,#4e2f7a)}
.ab.rdy i{background:linear-gradient(#c9a2ff,#8a55d0)}
.ab span{position:relative;display:block;font-size:10px;line-height:10px;text-align:center;color:#fff;text-shadow:1px 1px 0 #000;white-space:nowrap;overflow:hidden}
.p2 .ab{width:100px}
.p2 .bar{width:100px;height:10px}.p2 .bar span{font-size:9px;line-height:6px}
.wpn{font-size:12px;color:var(--ink);text-shadow:1px 1px 0 #000;white-space:nowrap}
.wpn em{font-style:normal;color:var(--muted)}
.res{display:flex;gap:12px;font-size:15px;text-shadow:1px 1px 0 #000;font-variant-numeric:tabular-nums}
.res span{display:flex;align-items:center;gap:5px}
.ico-c{width:9px;height:9px;background:var(--gold);box-shadow:inset -2px -2px 0 #a8792a,0 0 0 1px #000}
.ico-s{width:8px;height:8px;background:var(--soul);transform:rotate(45deg);box-shadow:0 0 6px var(--soul)}
.hc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;padding-top:2px}
#floorLbl{font-size:13px;color:var(--muted);letter-spacing:.06em;text-align:center;text-shadow:1px 1px 0 #000}
#enemyLbl{font-size:12px;color:var(--blood);text-shadow:1px 1px 0 #000}
#bossbar{width:min(360px,46vw);text-align:center}
#bossbar .bn{font-size:13px;color:var(--ink);text-shadow:1px 1px 0 #000;margin-bottom:2px}
#bossbar .bt{height:10px;background:#000b;border:2px solid #000}
#bossbar .bt i{display:block;height:100%;background:linear-gradient(90deg,var(--blood-d),var(--blood),#ff6a5a);transition:width .1s}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#mini{width:100px;height:100px;background:#000b;border:2px solid #000;image-rendering:pixelated}
.hbtns{display:flex;gap:6px;pointer-events:auto}
.hb{font-family:var(--display);font-size:13px;background:var(--panel2);border:2px solid #000;box-shadow:inset 0 -3px 0 #0006,inset 0 0 0 1px var(--line);padding:5px 9px;color:var(--ink)}
.hb b{color:var(--soul)}
.hb.glow{animation:pulse 1s steps(2) infinite}
.upb{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:16px;padding:9px 20px;box-shadow:inset 0 -4px 0 #0006,inset 0 0 0 1px var(--line),4px 4px 0 #000;touch-action:manipulation;white-space:nowrap}
.upb:active{transform:translate(calc(-50% + 2px),2px)}
@media (orientation:portrait) and (pointer:coarse){.upb{bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 200px)}}
@keyframes pulse{50%{background:#2d4d4a}}

/* touch */
#touch{position:absolute;inset:0;pointer-events:none}
#zone{position:absolute;left:0;bottom:0;width:50%;height:62%;pointer-events:auto;touch-action:none}
.zhint{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:max(22px,env(safe-area-inset-bottom,0px));font-family:var(--display);font-size:12px;color:#ffffff40}
#sbase{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:2px solid #ffffff38;background:#ffffff0c}
#sknob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#ffffff40;border:2px solid #ffffff60}
#tb{position:absolute;right:max(18px,env(safe-area-inset-right,0px));bottom:max(18px,env(safe-area-inset-bottom,0px));width:224px;height:190px;pointer-events:none}
.tbtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;font-family:var(--display);font-size:12px;color:#fff;border:2px solid #000;display:flex;align-items:center;justify-content:center;text-shadow:1px 1px 0 #000}
.tbtn.lg{right:0;bottom:0;width:92px;height:92px;background:#c8364bcc;box-shadow:inset 0 -5px 0 #0005;font-size:14px}
.tbtn.md{right:100px;bottom:0;width:64px;height:64px;background:#4a5f7ccc;box-shadow:inset 0 -4px 0 #0005}
.tbtn.sm{right:98px;bottom:74px;width:48px;height:48px;background:#3b2f45cc;box-shadow:inset 0 -4px 0 #0005;font-size:11px}
.tbtn.act{right:156px;bottom:118px;width:66px;height:66px;background:#2d8a7fdd;box-shadow:inset 0 -4px 0 #0005;font-size:11px;text-align:center;line-height:1.1;padding:4px}
.tbtn.ab{right:14px;bottom:100px;width:64px;height:64px;background:#6a3fa0dd;box-shadow:inset 0 -4px 0 #0005;font-size:12px}
.tbtn.ab.cd{opacity:.45}
.tbtn.on{filter:brightness(1.35)}

#toast{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-family:var(--display);font-size:18px;color:var(--soul);text-shadow:2px 2px 0 #000;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#toast.on{opacity:1}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;font-family:var(--display);opacity:0;transition:opacity .5s}
#banner.on{opacity:1}
#banner .b1{font-size:clamp(28px,6vw,52px);font-weight:700;color:var(--ink);text-shadow:3px 3px 0 var(--blood-d),6px 6px 0 #000;letter-spacing:.04em}
#banner .b2{font-size:clamp(14px,2.4vw,20px);color:var(--muted);margin-top:6px;text-shadow:2px 2px 0 #000}

/* overlays */
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#07050acc;overflow:auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));touch-action:pan-y}
#ov:empty{display:none}
.panel{width:100%;max-width:640px;margin:auto;background:var(--panel);border:3px solid #000;box-shadow:inset 0 0 0 2px var(--line),8px 8px 0 #000;padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--display);font-size:24px;font-weight:700;margin:0;text-wrap:balance}
.panel .sub{color:var(--muted);font-size:14px;margin:-8px 0 0;line-height:1.45}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums}
.stats b{color:var(--soul)} .stats .g{color:var(--gold)}
.sect{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--panel2);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line),inset 0 -3px 0 #0005;padding:9px 10px;min-width:0}
.card:hover:not(:disabled){box-shadow:inset 0 0 0 1px var(--soul),inset 0 -3px 0 #0005}
.card:disabled{opacity:.45;cursor:default}
.card .n{font-family:var(--display);font-size:15px;font-weight:600}
.card .d{font-size:12.5px;color:var(--muted);line-height:1.35}
.pips{display:flex;gap:3px}.pips i{width:8px;height:8px;background:#000;box-shadow:inset 0 0 0 1px var(--line)}.pips i.f{background:var(--soul);box-shadow:none}
.price{font-family:var(--display);font-size:13px;color:var(--gold)}
.price.s{color:var(--soul)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-family:var(--display);font-size:16px;font-weight:600;padding:10px 16px;background:var(--panel2);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line),inset 0 -4px 0 #0006,4px 4px 0 #000}
.btn.main{background:var(--blood);box-shadow:inset 0 0 0 1px #ff8a9a55,inset 0 -4px 0 #0006,4px 4px 0 #000}
.btn:active{transform:translate(2px,2px);box-shadow:inset 0 0 0 1px var(--line),inset 0 -4px 0 #0006,2px 2px 0 #000}
.title{font-family:var(--display);font-weight:700;line-height:.95;font-size:clamp(34px,7.4vw,64px);margin:0;letter-spacing:.01em;color:var(--ink);text-shadow:3px 3px 0 var(--blood-d),6px 6px 0 #000;text-wrap:balance}
.title small{display:block;font-size:.36em;color:var(--blood);text-shadow:2px 2px 0 #000;letter-spacing:.12em;margin-top:10px;text-transform:uppercase}
.lore{font-size:14.5px;line-height:1.55;color:var(--muted);max-width:60ch;margin:0}
.lore b{color:var(--ink);font-weight:500}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 18px;font-size:13px;color:var(--muted);line-height:1.6}
.ctrl h4{margin:0 0 2px;font-family:var(--display);font-size:13px;color:var(--ink);font-weight:600}
kbd{font-family:var(--display);font-size:12px;color:var(--ink);background:#000;padding:0 5px;border:1px solid var(--line)}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tiers div{background:#0006;border:1px solid var(--line);padding:7px 9px;font-size:12.5px;color:var(--muted);line-height:1.4}
.tiers b{display:block;font-family:var(--display);font-size:13px;color:var(--ink);font-weight:600}
.note{font-size:12px;color:var(--muted)}
.guide .gh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{font-family:var(--display);font-size:14px;padding:6px 11px;background:var(--panel2);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line),inset 0 -3px 0 #0005}
.tab.on{background:var(--blood);box-shadow:inset 0 0 0 1px #ff8a9a55,inset 0 -3px 0 #0005}
.gbody{display:flex;flex-direction:column;gap:12px}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.gi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;align-content:start;background:var(--panel2);border:1px solid var(--line);padding:9px}
.gi>canvas,.gi>.sw{grid-row:span 3;image-rendering:pixelated;background:#0008;border:1px solid var(--line)}
.gi>canvas[data-en]{width:56px;height:56px}.gi>canvas[data-por]{width:56px;height:68px}.gi>canvas[data-wpn]{width:64px;height:43px}.gi.boss>canvas{width:84px;height:84px}
.gi>.sw{width:48px;height:48px}
.gi.nopic{grid-template-columns:minmax(0,1fr)}
.gi .n{font-family:var(--display);font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gi .m{font-family:var(--display);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.gi .d{font-size:12.5px;color:var(--muted);line-height:1.4}
.gi .d b{color:#c9a2ff;font-weight:500}
.gi .d.wide{grid-column:1/-1}
.gi .wcin{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:12px}
.gtext{display:flex;flex-direction:column;gap:8px}
.gtext p{margin:0;font-size:13.5px;line-height:1.55;color:var(--muted);max-width:75ch}
.gtext b{color:var(--ink);font-weight:500}
.wcard{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(250px,calc(100% - 32px));pointer-events:none;background:#17121ce8;border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line),4px 4px 0 #000;padding:9px 11px;display:flex;flex-direction:column;gap:5px;font-size:12px}
@media (orientation:portrait) and (pointer:coarse){.wcard{bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 200px)}}
.wc-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.wc-n{font-family:var(--display);font-size:15px;font-weight:700}
.wc-t{font-family:var(--display);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.t0{color:var(--ink)}.t1{color:#8fd16a}.t2{color:#7fb4ff}.t3{color:#d79aff}
.wc-g{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums}
.wc-g span:nth-child(3n+1){color:var(--muted)}
.wc-g b{font-family:var(--display);font-weight:600;color:var(--ink);text-align:right}
.up{color:#8fd16a}.dn{color:#ff6a7a}.eq{color:var(--muted)}
.wc-tr{display:flex;flex-wrap:wrap;gap:4px}
.wc-tr i{font-style:normal;font-size:11px;color:var(--soul);border:1px solid #72e3d355;padding:0 5px}
.wc-k{font-size:11px;color:var(--muted)}
.wlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.wlist .wcard{position:static;transform:none;width:auto;pointer-events:auto;background:var(--panel2)}
.wpn{pointer-events:none}
#wrap:has(#ov:not(:empty)) #wcard{display:none}
.lvc{font-size:13px;color:var(--gold)}.lvc b{color:var(--ink)}
.panel.lvlp{max-width:760px}
.panel.lvlp h2{color:var(--gold);text-shadow:2px 2px 0 #000}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card.lv{gap:7px;padding:12px;min-height:min(150px,calc(100vh - 220px));max-height:calc(100vh - 210px);max-height:calc(100dvh - 210px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:#6a5a7e transparent;animation:pop .22s ease-out backwards}
.card.lv:nth-child(2){animation-delay:.05s}.card.lv:nth-child(3){animation-delay:.1s}

.card.lv .top{display:flex;align-items:center;gap:6px;width:100%}

.c-a{color:#c9a2ff}.c-s{color:var(--armor)}.c-w{color:var(--gold)}.c-p{color:#ff6a7a}.c-x{color:var(--soul)}
.new{font-family:var(--display);font-size:11px;color:var(--soul)}
.kn{margin-left:auto}
.card.lv .n{font-size:17px}

.d.pl{color:#8fd16a}.d.mi{color:#ff7a88}

.lvl{font-family:var(--display);font-size:12px;color:var(--muted);margin-top:auto}
.pips i.nx{background:var(--gold);box-shadow:none;animation:pulse2 .8s steps(2) infinite}
@keyframes pulse2{50%{background:#5a4620}}
.owned{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.owned b{color:var(--ink);font-weight:500}
@media (max-width:560px){.grid3{grid-template-columns:1fr}.card.lv{min-height:0}}

<style>

}

const getT=(x,y)=>(x<0||y<0||x>=MW||y>=MH)?V:map[y*MW+x];
const setT=(x,y,t)=>{if(x>=0&&y>=0&&x<MW&&y<MH)map[y*MW+x]=t};
function solidT(tx,ty){const t=getT(tx,ty);if(t===F)return false;if(t===D){const o=owner[ty*MW+tx];return o>=0&&G.rooms[o].locked;}return true;}
const solidP=(x,y)=>solidT(Math.floor(x/TS),Math.floor(y/TS));
function hitsWall(x,y,r){return solidP(x-r,y-r)||solidP(x+r,y-r)||solidP(x-r,y+r)||solidP(x+r,y+r)||solidP(x,y-r)||solidP(x,y+r)||solidP(x-r,y)||solidP(x+r,y);}
function moveEnt(e,dx,dy){e.hitWall=false;if(!hitsWall(e.x+dx,e.y,e.r))e.x+=dx;else e.hitWall=true;if(!hitsWall(e.x,e.y+dy,e.r))e.y+=dy;else e.hitWall=true;}
function los(a,b){const d=dist(a,b),n=Math.ceil(d/7);for(let i=1;i<n;i++){const k=i/n;if(solidP(a.x+(b.x-a.x)*k,a.y+(b.y-a.y)*k))return false;}return true;}

  const ti=(G.floor-1)%4;G.tier=TIERS[ti];G.loop=Math.floor((G.floor-1)/4);

  for(;;){
    tries++;
    const n=Math.min(13,7+Math.floor(G.floor/2)+(G.coop?1:0));
    rooms=[{gx:2,gy:2,links:[]}];const occ={'2,2':1};let guard=0;
    while(rooms.length<n&&guard++<800){
      const r=pick(rooms);const [dx,dy]=pick([[1,0],[-1,0],[0,1],[0,-1]]);
      const nx=r.gx+dx,ny=r.gy+dy;
      if(nx<0||ny<0||nx>=GRID||ny>=GRID||occ[nx+','+ny])continue;
      if(r.links.length>=3&&Math.random()<.75)continue;
      const nr={gx:nx,gy:ny,links:[r]};r.links.push(nr);rooms.push(nr);occ[nx+','+ny]=1;
    }
    rooms.forEach(r=>r.d=-1);rooms[0].d=0;const q=[rooms[0]];
    while(q.length){const r=q.shift();for(const l of r.links)if(l.d<0){l.d=r.d+1;q.push(l);}}
    leaves=rooms.filter(r=>r!==rooms[0]&&r.links.length===1).sort((a,b)=>b.d-a.d);
    if((leaves.length>=2&&leaves[0].d>=3)||tries>60)break;
  }
  rooms[0].type='start';leaves[0].type='boss';
  const free=()=>rooms.filter(r=>!r.type);
  const am=leaves[1]||pick(free());am.type='automat';
  const ch=leaves[2]||pick(free());if(ch)ch.type='chest';
  rooms.forEach(r=>{if(!r.type)r.type='fight';});
  const SZ={start:[6,5],fight:[9,6],automat:[6,5],chest:[5,4],boss:[12,9]};
  rooms.forEach((r,i)=>{
    r.i=i;r.cx=r.gx*CELL+15;r.cy=r.gy*CELL+15;[r.hw,r.hh]=SZ[r.type];
    r.x1=r.cx-r.hw;r.x2=r.cx+r.hw;r.y1=r.cy-r.hh;r.y2=r.cy+r.hh;
    r.visited=false;r.known=false;r.locked=false;r.doors=[];r.cleared=!(r.type==='fight'||r.type==='boss');
    for(let y=r.y1;y<=r.y2;y++)for(let x=r.x1;x<=r.x2;x++)setT(x,y,(x===r.x1||x===r.x2||y===r.y1||y===r.y2)?W:F);
  });
  const door=(x,y,r)=>{setT(x,y,D);owner[y*MW+x]=r.i;r.doors.push([x,y]);};
  rooms.forEach(a=>a.links.forEach(b=>{
    if(a.i>b.i)return;
    if(a.gy===b.gy){const L=a.gx<b.gx?a:b,R=L===a?b:a,y=L.cy;
      for(let x=L.x2+1;x<R.x1;x++){for(let k=-1;k<=1;k++)setT(x,y+k,F);if(getT(x,y-2)===V)setT(x,y-2,W);if(getT(x,y+2)===V)setT(x,y+2,W);}
      for(let k=-1;k<=1;k++){door(L.x2,y+k,L);door(R.x1,y+k,R);}
    }else{const T=a.gy<b.gy?a:b,B=T===a?b:a,x=T.cx;
      for(let y=T.y2+1;y<B.y1;y++){for(let k=-1;k<=1;k++)setT(x+k,y,F);if(getT(x-2,y)===V)setT(x-2,y,W);if(getT(x+2,y)===V)setT(x+2,y,W);}
      for(let k=-1;k<=1;k++){door(x+k,T.y2,T);door(x+k,B.y1,B);}
    }
  }));
  G.rooms=rooms;G.flasks=[];G.clouds=[];G.fx=[];G.hazards=[];G.decoy=null;G.enemies=[];G.bullets=[];G.parts=[];G.coins=[];G.items=[];G.texts=[];G.spawns=[];G.boss=null;G.curRoom=null;
  const s=rooms[0];s.visited=true;s.links.forEach(l=>l.known=true);
  const sx=(s.cx+.5)*TS,sy=(s.cy+.5)*TS;
  G.players.forEach((p,i)=>{p.x=sx+(i?14:-6);p.y=sy+8;p.dead=false;p.dashT=0;});
  G.cam.x=sx;G.cam.y=sy;
  rooms.forEach(r=>{
    const cx=(r.cx+.5)*TS,cy=(r.cy+.5)*TS;
    if(r.type==='automat')G.items.push({kind:'machine',x:cx,y:cy-6,r:8});
    if(r.type==='chest')G.items.push({kind:'chest',x:cx,y:cy,r:8,big:false});
  });
  G.lore=G.floor===1&&G.loop===0;
  $('bossbar').hidden=true;
  hudFloor();
}

/* ---------- combat ---------- */
function fire(p){
  const w=WEAPONS[p.weapons[p.wi]];if(p.fireCd>0||p.noFire>0)return;
  if(w.spinup)p.mgSpin=Math.min(1,(p.mgSpin||0)+.1);
  p.fireCd=w.rate/(1+.12*U.rate)/(p.rage>0?(U.bu2?2:1.6):1)/(w.spinup?1+3*p.mgSpin:1);
  const total=w.n+U.multi,fan=w.n>1?w.spread+U.multi*.08:U.multi*.13,jit=w.n>1?.06:w.spread*.5;
  const ox=p.x+Math.cos(p.aim)*12,oy=p.y-5+Math.sin(p.aim)*12;
  for(let i=0;i<total;i++){
    const a=p.aim+(total>1?(i/(total-1)-.5)*fan:0)+rnd(-jit,jit);
    const crit=Math.random()<.08*U.crit+(p.hero==='samurai'&&!U.sa3?.15:0);
    if(w.rail){railShot(p,ox,oy,a,w.dmg*(1+.2*U.dmg)*(crit?2:1),crit);continue;}
    const spd=w.spd*(w.n>1?rnd(.85,1.1):1);
    G.bullets.push({x:ox,y:oy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,r:w.r,e:0,col:crit?'#fff4b0':w.col,life:w.life,dmg:w.dmg*(1+.2*U.dmg)*(crit?2:1),crit,pierce:(w.pierce||0)+U.pierce,bounce:(w.bounce||0)+U.bounce,homing:w.homing||0,explode:w.explode||0,hit:new Set(),owner:p,slash:w.slash||0,flame:w.flame||0,wave:w.wave||0,boomer:w.boomer||0,frost:w.frost||0,chain:w.chain||0,t:0,max:w.life});
  }
  G.parts.push({x:ox,y:oy,vx:0,vy:0,life:.06,max:.06,col:'#fff2c0',sz:4});
  if(w.n>1||w.explode||w.rail)shake(w.rail?3:1.5);
}
function chainZap(e0,dmg,n){let src=e0;const hs=new Set([e0]);
  for(let c=0;c<n;c++){let nb=null,bd=75;for(const o of G.enemies){if(o.dead||o.phased||hs.has(o))continue;const d=dist(src,o);if(d<bd){bd=d;nb=o;}}if(!nb)break;
    G.fx.push({type:'zap',x0:src.x,y0:src.y-4,x1:nb.x,y1:nb.y-4,life:.18,max:.18,seed:rnd(100)});hs.add(nb);hurtEnemy(nb,dmg,false,null);src=nb;}}
function railShot(p,ox,oy,a,dmg,crit){
  const L=ray(ox,oy,a,420),x1=ox+Math.cos(a)*L,y1=oy+Math.sin(a)*L;
  for(const e of G.enemies){if(e.dead||e.phased||(e.isBoss&&e.z>10))continue;if(segDist(e.x,e.y-3,ox,oy,x1,y1)<e.r+3){hurtEnemy(e,dmg,crit,a);if(p.hero==='serpent'&&!e.dead){e.poisonT=2.5;e.poisonD=1.4*(U.se3?2:1)*(1+.2*U.dmg);}}}
  G.fx.push({type:'rail',x0:ox,y0:oy,x1,y1,life:.22,max:.22});burst(x1,y1,'#9ff5ea',10,80,2);
}

/* ---------- enemy AI ---------- */
function updEnemy(e,dt){
  e.flash-=dt;e.anim+=dt;e.t+=dt;e.cd-=dt;
  const p=nearestPlayer(e);if(!p)return;
  const a=ang(e,p),dd=dist(e,p);e.face=Math.cos(a)>=0?1:-1;e.fa=a;
  switch(e.type){
  case 'slime':
    if(e.state==='hop'){e.ht-=dt;moveEnt(e,e.vx*dt,e.vy*dt);if(e.ht<=0){e.state='idle';e.cd=rnd(.6,1.1);}}
    else if(e.cd<=0){e.state='hop';e.ht=.35;const aa=a+rnd(-.35,.35);e.vx=Math.cos(aa)*120;e.vy=Math.sin(aa)*120;}
    break;
  case 'skeleton':{
    const sp=42;if(Math.random()<dt*.4)e.str*=-1;
    if(dd>135)moveEnt(e,Math.cos(a)*sp*dt,Math.sin(a)*sp*dt);
    else if(dd<80)moveEnt(e,-Math.cos(a)*sp*dt,-Math.sin(a)*sp*dt);
    else moveEnt(e,Math.cos(a+Math.PI/2)*e.str*22*dt,Math.sin(a+Math.PI/2)*e.str*22*dt);
    if(e.cd<=0){e.cd=rnd(1.4,2.1);if(los(e,p))ebul(e.x,e.y-2,a,135,{col:'#ede4d3',kind:'arrow',r:2.5});}
    break;}
  case 'zombie':
    if(e.state==='lunge'){e.lt-=dt;moveEnt(e,e.vx*dt,e.vy*dt);if(e.lt<=0||e.hitWall){e.state='walk';e.cd=2;}}
    else if(e.state==='wind'){e.wt-=dt;if(e.wt<=0){e.state='lunge';e.lt=.35;e.vx=Math.cos(a)*155;e.vy=Math.sin(a)*155;}}
    else{moveEnt(e,Math.cos(a)*26*dt,Math.sin(a)*26*dt);if(dd<58&&e.cd<=0&&los(e,p)){e.state='wind';e.wt=.35;}}
    break;

function update(dt){

  for(const p of G.players){if(p.dead)continue;const r=roomOf(p.x,p.y,.6);if(r&&!r.visited)enterRoom(r,p);}
  for(const s of G.spawns){s.t-=dt;if(s.t<=0){G.enemies.push(mkEnemy(s.type,s.x,s.y));burst(s.x,s.y,'#c8364b',8,50);}}

  for(const z of G.hazards){z.life-=dt;for(const q of G.players)if(!q.dead&&Math.hypot(q.x-z.x,q.y-z.y)<z.r+q.r-3)hurtPlayer(q);}
  G.hazards=G.hazards.filter(z=>z.life>0);
  for(const f of G.flasks){f.t+=dt;const k=Math.min(1,f.t/f.T);f.x=f.sx+(f.tx-f.sx)*k;f.y=f.sy+(f.ty-f.sy)*k-Math.sin(k*Math.PI)*26;
    if(k>=1){f.done=true;G.clouds.push({x:f.tx,y:f.ty,r:U.do3?27:42,life:U.do2?3:4.5,max:U.do2?3:4.5,tick:0,seed:rnd(TAU),acid:U.do2>0,heal:U.do3>0});burst(f.tx,f.ty,'#a7e05a',22,90,3);burst(f.tx,f.ty,'#e8f6c0',8,50,2);shake(2);}}
  G.flasks=G.flasks.filter(f=>!f.done);
  for(const c of G.clouds){c.life-=dt;c.tick-=dt;
    if(c.heal){c.hk=(c.hk||0)-dt;if(c.hk<=0){c.hk=1.5;for(const q of G.players)if(!q.dead&&q.hp<maxHp(q)&&Math.hypot(q.x-c.x,q.y-c.y)<c.r){q.hp++;txt(q.x,q.y-18,'+1','#a7e05a');}}}
    for(const e of G.enemies)if(!e.dead&&!e.phased&&Math.hypot(e.x-c.x,e.y-c.y)<c.r+e.r*.5&&!c.acid)e.slowT=.3;
    if(c.tick<=0){c.tick=.25;const dmg=2.4*(c.acid?2:1)*(1+.2*U.dmg)*(1+.2*G.loop);for(const e of G.enemies)if(!e.dead&&!e.phased&&Math.hypot(e.x-c.x,e.y-c.y)<c.r+e.r*.5)hurtEnemy(e,dmg,false,null);}
    if(Math.random()<.5)G.parts.push({x:c.x+rnd(-c.r,c.r)*.8,y:c.y+rnd(-c.r,c.r)*.6,vx:0,vy:-14,life:.6,max:.6,col:Math.random()<.5?'#a7e05a':'#6f9a3a',sz:2});}
  G.clouds=G.clouds.filter(c=>c.life>0);
  for(const e of G.enemies)if(!e.dead){const sl=e.slowT>0;e.slowT=(e.slowT||0)-dt;
    if(e.poisonT>0){e.poisonT-=dt;e.poisonK=(e.poisonK||0)-dt;if(e.poisonK<=0){e.poisonK=.5;hurtEnemy(e,e.poisonD,false,null);if(!e.dead)G.parts.push({x:e.x+rnd(-3,3),y:e.y-e.r-2,vx:0,vy:-18,life:.4,max:.4,col:'#7ad05a',sz:2});}if(e.dead)continue;}
    updEnemy(e,sl?dt*.5:dt);}
  // separation + contact
  const es=G.enemies;
  for(let i=0;i<es.length;i++){const a=es[i];if(a.dead)continue;
    for(let j=i+1;j<es.length;j++){const b=es[j];if(b.dead)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,m=a.r+b.r;
      if(d<m){const push=(m-d)/2;const ux=dx/d,uy=dy/d;if(!a.isBoss)moveEnt(a,-ux*push,-uy*push);if(!b.isBoss)moveEnt(b,ux*push,uy*push);}}
    if(a.state==='hidden'||a.phased||a.state==='latch'||(a.isBoss&&a.z>10))continue;
    for(const p of G.players)if(!p.dead&&dist(a,p)<a.r+p.r-1)hurtPlayer(p);
  }
  // bullets
  for(const b of G.bullets){
    for(let s=0;s<2&&b.life>0;s++){
      const h=dt/2;
      if(b.homing){const tg=b.e?nearestPlayer(b):nearestEnemy(b,150);if(tg){const ta=ang(b,tg),ca=Math.atan2(b.vy,b.vx);let df=((ta-ca+Math.PI*3)%TAU)-Math.PI;const na=ca+clamp(df,-b.homing*h,b.homing*h),sp=Math.hypot(b.vx,b.vy);b.vx=Math.cos(na)*sp;b.vy=Math.sin(na)*sp;}}
      if(b.boomer&&b.owner){b.bt=(b.bt||0)+h;if(b.bt>.5){if(!b.back){b.back=1;b.hit=new Set();}const o=b.owner,ta=Math.atan2(o.y-4-b.y,o.x-b.x),sp=Math.hypot(b.vx,b.vy);b.vx=Math.cos(ta)*sp;b.vy=Math.sin(ta)*sp;if(Math.hypot(o.x-b.x,o.y-4-b.y)<8){b.life=0;continue;}}}
      let wvx=0,wvy=0;if(b.wave){b.t+=h;const sp=Math.hypot(b.vx,b.vy)||1,w=Math.cos(b.t*20)*90;wvx=-b.vy/sp*w;wvy=b.vx/sp*w;}
      const nx=b.x+(b.vx+wvx)*h,ny=b.y+(b.vy+wvy)*h;
      if(solidP(nx,ny)&&!b.back){
        if(!b.e&&b.bounce>0){b.bounce--;if(solidP(nx,b.y))b.vx*=-1;if(solidP(b.x,ny))b.vy*=-1;if(!solidP(nx,b.y)&&!solidP(b.x,ny)){b.vx*=-1;b.vy*=-1;}}
        else{b.life=0;if(b.explode)explode(b.x,b.y,b.explode,b.dmg);else burst(b.x,b.y,b.col,4,40,1.5);}
        continue;
      }
      b.x=nx;b.y=ny;
      if(b.slash)for(const o of G.bullets)if(o.e&&o.life>0&&Math.hypot(o.x-b.x,o.y-b.y)<b.r+o.r){o.life=0;burst(o.x,o.y,'#e8eef8',3,40,1.5);}
      if(b.e){for(const p of G.players)if(!p.dead&&p.dashT<=0&&Math.hypot(p.x-b.x,p.y-1-b.y)<p.r+b.r-1.5){hurtPlayer(p);if(b.kind==='web'){p.slowT=1.6;txt(p.x,p.y-18,'паутина','#e6e0f0');}b.life=0;break;}}
      else for(const e of G.enemies){if(e.dead||e.phased||b.hit.has(e))continue;if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
        if(b.explode){explode(b.x,b.y,b.explode,b.dmg);b.life=0;break;}
        if(e.type==='shield'&&Math.cos(Math.atan2(b.vy,b.vx)-(e.fa||0)-Math.PI)>.35){b.life=0;burst(b.x,b.y,'#efbd4e',5,50,1.5);break;}
        hurtEnemy(e,b.dmg,b.crit,Math.atan2(b.vy,b.vx));b.hit.add(e);if(b.owner&&b.owner.hero==='serpent'&&!e.dead){e.poisonT=2.5;e.poisonD=1.4*(U.se3?2:1)*(1+.2*U.dmg);}if(b.frost&&!e.dead){e.slowT=Math.max(e.slowT||0,1.5);burst(e.x,e.y-4,'#a8e4ff',4,30,1.5);}if(b.chain)chainZap(e,b.dmg*.7,b.chain);burst(b.x,b.y,b.col,3,40,1.5);
        if(b.pierce>0)b.pierce--;else{b.life=0;break;}}}
    }
    b.life-=dt;
  }
  G.bullets=G.bullets.filter(b=>b.life>0);
  G.enemies=G.enemies.filter(e=>!e.dead);
  // coins
  for(const c of G.coins){c.t+=dt;const p=nearestReal(c);
    if(p){const d=dist(c,p);if(c.mag||d<44*(1+.6*(U.magnet+(p.hero==='frog'?2:0)))){c.mag=true;const a=ang(c,p);c.vx+=Math.cos(a)*700*dt;c.vy+=Math.sin(a)*700*dt;}if(d<8&&c.t>.25){c.dead=true;addCoins(1);}}
    c.vx*=Math.pow(.02,dt);c.vy*=Math.pow(.02,dt);c.x+=c.vx*dt;c.y+=c.vy*dt;}
  G.coins=G.coins.filter(c=>!c.dead);
  // items: hearts, near detection

  for(let i=G.items.length-1;i>=0;i--){const it=G.items[i];it.t=(it.t||0)+dt;
    if(it.kind==='heart'){for(const p of G.players)if(!p.dead&&dist(p,it)<9+8*(U.magnet+(p.hero==='frog'?2:0))&&p.hp<maxHp(p)){p.hp=Math.min(maxHp(p),p.hp+2);txt(p.x,p.y-14,'+2','#e2546a');G.items.splice(i,1);break;}continue;}
    if(it.kind==='chest'&&it.open)continue;
    for(const p of G.players){if(p.dead)continue;const d=dist(p,it);if(d<it.r+16&&(!p.near||d<dist(p,p.near)))p.near=it;}
  }
  // particles
  for(const q of G.parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(!q.soul){q.vx*=Math.pow(.05,dt);q.vy*=Math.pow(.05,dt);}}
  G.parts=G.parts.filter(q=>q.life>0);
  for(const t of G.texts){t.life-=dt;t.y-=18*dt;}G.texts=G.texts.filter(t=>t.life>0);
  // room clear
  const r=G.curRoom;
  if(r&&r.locked&&G.enemies.length===0&&G.spawns.length===0){if(r.type==='fight'&&r.waveLeft>0)spawnWave(r);else clearRoom(r);}
  G.shake=Math.max(0,G.shake-dt*20);
  // camera
  const al=alivePlayers();const tg=al.length?al:G.players;
  let tx=0,ty=0;tg.forEach(p=>{tx+=p.x;ty+=p.y;});tx/=tg.length;ty/=tg.length;

  const k=1-Math.pow(.0005,dt);G.cam.x+=(tx-G.cam.x)*k;G.cam.y+=(ty-G.cam.y)*k;
  for(const kk in pressed)delete pressed[kk];for(const kk in vp)delete vp[kk];
  hud();
}

const TIERN=['Стартовое','Обычное','Редкое','Эпическое'];
function wstat(k,u=U){const w=WEAPONS[k],dm=1+.2*u.dmg,rm=1+.12*u.rate,n=w.rail?1+u.multi:(w.n||1)+u.multi;
  const dmg=w.dmg*dm,rps=rm/w.rate*(w.spinup?4:1),range=w.rail?420:w.boomer?w.spd*.5:w.spd*w.life;
  return {dmg,rps,dps:dmg*n*rps,range,n};}
function wtraits(k){const w=WEAPONS[k],t=[];
  if(w.n>1)t.push(`${w.n} снарядов веером`);
  if(w.rail)t.push('мгновенный луч сквозь всех');
  if(w.pierce>=99&&!w.rail)t.push('пронзает всех');else if(w.pierce)t.push(`пробивает ${w.pierce}`);
  if(w.bounce)t.push(`рикошет ×${w.bounce}`);
  if(w.homing)t.push('самонаведение');
  if(w.explode)t.push(`взрыв ${w.explode} px`);
  if(w.slash)t.push('режет пули');
  if(w.flame)t.push('пламя');
  if(w.wave)t.push('летит волной');
  if(w.boomer)t.push('возвращается');
  if(w.frost)t.push('замедляет на 1,5 с');
  if(w.chain)t.push(`молния на ${w.chain} врагов`);
  if(w.spinup)t.push('раскручивается до ×4');
  return t;}
const f1=v=>v>=10?Math.round(v).toString():(Math.round(v*10)/10).toString().replace('.',',');
function wcardHTML(k,cmp,hint,u=U){const w=WEAPONS[k],a=wstat(k,u),c=cmp&&cmp!==k?wstat(cmp,u):null;
  const d=(x,y)=>!c?'<i></i>':x>y*1.05?'<i class="up">▲</i>':x<y*.95?'<i class="dn">▼</i>':'<i class="eq">=</i>';
  const rows=[['Урон',f1(a.dmg)+(a.n>1?' ×'+a.n:''),d(a.dmg*a.n,c&&c.dmg*c.n)],['Выстрелов в секунду',(w.spinup?'до ':'')+f1(a.rps),d(a.rps,c&&c.rps)],['Урон в секунду',f1(a.dps),d(a.dps,c&&c.dps)],['Дальность',Math.round(a.range/16)+' кл.',d(a.range,c&&c.range)]];
  const tr=wtraits(k);
  return `<div class="wc-h"><span class="wc-n t${w.tier}">${w.name}</span><span class="wc-t t${w.tier}">${TIERN[w.tier]}</span></div>
  <div class="wc-g">${rows.map(r=>`<span>${r[0]}</span><b>${r[1]}</b>${r[2]}`).join('')}</div>
  ${tr.length?`<div class="wc-tr">${tr.map(x=>`<i>${x}</i>`).join('')}</div>`:''}${hint?`<div class="wc-k">${hint}</div>`:''}`;}

    return `<${tag} class="hero${own?'':' locked'}"${own?` data-hero="${k}"`:''}><canvas width="84" height="102" data-por="${k}"></canvas><span class="head"><span class="n">${h.name}</span>
    <span class="st"><span>Здоровье <b>${h.hp}</b></span><span>Щит <b>${h.ar}</b></span><span>Скорость <b>${h.spd>1?'высокая':h.spd<1?'ниже средней':'средняя'}</b></span></span></span>
    <span class="ab2"><b>${h.abil}</b>, раз в ${h.cd} с. ${h.adesc}</span>
    <span class="ab2">${h.pdesc} Стартовое оружие: ${WEAPONS[h.wpn].name.toLowerCase()}.</span>
    ${own?'':`<button class="btn buy" data-buy="${k}" ${META.bank<PRICE[k]?'disabled':''}><i class="ico-c"></i>${META.bank<PRICE[k]?'Нужно':'Купить за'} ${PRICE[k]} монет</button>`}</${tag}>`;};
  const n=Object.keys(HEROES).filter(owns).length,all=Object.keys(HEROES).length;
  OV.innerHTML=`<div class="panel wide"><h2>Выбери героя</h2>
  <div class="bank"><i class="ico-c"></i><span>Копилка: <b>${META.bank}</b> монет</span><span class="note">Открыто героев: ${n} из ${all}</span></div>
  <p class="sub">Все монеты, собранные в забегах, попадают в копилку. За них открываются новые герои. Способность героя: на компьютере — F или правая кнопка мыши, на телефоне — фиолетовая кнопка.</p>
  <div class="heroes">${Object.keys(HEROES).map(card).join('')}</div>
  <div class="row"><button class="btn" data-act="menu">Назад</button></div></div>`;
  OV.querySelectorAll('canvas[data-por]').forEach(c=>drawPortrait(c,c.dataset.por));
}
function showOver(){
  ov='over';saveMeta();$('touch').hidden=true;checkRot();
  try{if(G.floor>best){best=G.floor;localStorage.setItem('dues.best',best);cloudBest();}}catch(e){}
  OV.innerHTML=`<div class="panel"><h2>Ты не выбрался</h2><p class="sub">Никто не выбирается. Подземелье забрало ещё одну душу.</p>
  <div class="stats"><span>Ярус: <b>${G.floor}</b></span><span>Убито: <b>${G.kills}</b></span><span>Рекорд: <b>${best}</b></span><span>В копилку: <b class="g">+${G.earned||0}</b></span></div>
  <div class="row"><button class="btn main" data-act="again">Снова вниз</button><button class="btn" data-act="menu">Главное меню</button></div></div>`;
}
OV.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.buy){const k=b.dataset.buy;if(!owns(k)&&META.bank>=PRICE[k]){META.bank-=PRICE[k];META.owned.push(k);saveMeta();showSelect(false);}return;}
  if(b.dataset.hero){if(owns(b.dataset.hero))start(coopSel,b.dataset.hero);return;}
  if(b.dataset.pick){pickUpg(b.dataset.pick);return;}
  const a=b.dataset.act;
  if(a==='close')closeOv();
  else if(a==='reroll'){if(G.coinsN>=G.rerollCost){G.coinsN-=G.rerollCost;G.rerollCost+=5;G.lvlOpts=null;showLevel();lvlOpenT=0;}return;}
  else if(a==='sel1')showSelect(false);
  else if(a==='again')start(G.coop,G.players[0].hero);
  else if(a==='menu'){saveMeta();toTitle();}
  else if(a==='guide'){guideFrom=ov;showGuide(guideTab);}
  else if(a==='gback')closeGuide();
  else if(a&&a.startsWith('gt-'))showGuide(a.slice(3));
  else if(a==='m-point'){const c=soulCost();if(G.souls>=c){G.souls-=c;G.soulBuys++;G.points++;closeOv();}else showMachine();}
  else if(a==='m-coins'){addCoins(G.souls*2);G.souls=0;showMachine();}
  else if(a==='m-heal'){const pp=20+5*G.loop;if(G.coinsN>=pp){G.coinsN-=pp;G.players.forEach(p=>{if(!p.dead)p.hp=Math.min(maxHp(p),p.hp+3);});}showMachine();}
  else if(a==='m-armor'){if(G.coinsN>=15){G.coinsN-=15;G.players.forEach(p=>p.armor=maxAr(p));}showMachine();}
  else if(a==='m-weapon'){const wp=55+10*G.loop;if(G.coinsN>=wp){G.coinsN-=wp;const m=G.items.find(i=>i.kind==='machine');G.items.push({kind:'weapon',w:randWeapon(true),x:m.x+rnd(-20,20),y:m.y+24,r:6,t:0});}closeOv();}
  hud();
});
$('bPause').addEventListener('click',()=>{if(G&&G.state==='play'){ov?closeOv():showPause();}});

function newGame(coop,hero='butcher'){
  U={};UPG.forEach(u=>U[u.k]=0);
  G={flasks:[],clouds:[],fx:[],hazards:[],decoy:null,floor:1,coop,players:[mkPlayer(0,hero)],rooms:[],enemies:[],bullets:[],parts:[],coins:[],items:[],texts:[],spawns:[],points:0,level:0,rerollCost:10,lvlOpts:null,coinsN:0,souls:0,kills:0,soulBuys:0,cam:{x:0,y:0},shake:0,state:'title',boss:null,time:0,curRoom:null};
  if(coop)G.players.push(mkPlayer(1,hero==='butcher'?'witch':'butcher'));
  genFloor();
}
function start(coop,hero){
  newGame(coop,hero);G.state='play';closeOv();
  $('hud').hidden=false;$('pl1').hidden=!coop;$('bossbar').hidden=true;
  setTouch(touchMode);resize();
  banner('Ярус 1',G.tier.name);
}
function toTitle(){newGame(false);showMenu();}

let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(G){
    if(G.state==='play'&&!ov&&G.points>0)showLevel();
    if(G.state==='play'&&!ov)update(dt);
    else if(G.state==='over'){G.time+=dt;for(const q of G.parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;}G.parts=G.parts.filter(q=>q.life>0);G.shake=Math.max(0,G.shake-dt*20);}
    else if(G.state==='title'){G.time+=dt;const s=G.rooms[0];G.cam.x=(s.cx+.5)*TS+Math.sin(G.time*.15)*120;G.cam.y=(s.cy+.5)*TS+Math.cos(G.time*.11)*70;}
    render();
  }
  requestAnimationFrame(frame);
}
function boot(){resize();toTitle();if(matchMedia('(pointer:coarse)').matches)touchMode=true;requestAnimationFrame(frame);}

/* ---------- Telegram Mini App ---------- */
let backShown=null,confirmOn=null;
function backAction(){
  if(!G)return;
  if(ov==='guide')closeGuide();
  else if(ov==='select')showMenu();
  else if(ov==='pause'||ov==='machine')closeOv();
  else if(ov==='over')toTitle();
  else if(!ov&&G.state==='play')showPause();
}
function syncTG(){
  if(!TG)return;
  const want=!!G&&ov!=='menu'&&ov!=='level'&&(ov||G.state==='play');
  if(want!==backShown&&tgv('6.1')){backShown=want;try{want?TG.BackButton.show():TG.BackButton.hide();}catch(e){}}
  const conf=!!G&&G.state==='play';
  if(conf!==confirmOn&&tgv('6.2')){confirmOn=conf;try{conf?TG.enableClosingConfirmation():TG.disableClosingConfirmation();}catch(e){}}
}
function pauseIfPlaying(){if(G&&G.state==='play'&&!ov)showPause();}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseIfPlaying();});
if(TG){
  try{TG.ready();TG.expand();}catch(e){}
  try{if(tgv('6.1')){TG.setHeaderColor('#0c0a0f');TG.setBackgroundColor('#0c0a0f');}if(tgv('7.10'))TG.setBottomBarColor('#0c0a0f');}catch(e){}
  try{if(tgv('7.7'))TG.disableVerticalSwipes();}catch(e){}
  try{if(tgv('8.0')&&(TG.platform==='ios'||TG.platform==='android'))TG.requestFullscreen();}catch(e){}
  try{if(tgv('6.1'))TG.BackButton.onClick(backAction);}catch(e){}
  const relayout=()=>setTimeout(resize,60);
  ['viewportChanged','fullscreenChanged','safeAreaChanged','contentSafeAreaChanged'].forEach(ev=>{try{TG.onEvent(ev,relayout);}catch(e){}});
  try{TG.onEvent('deactivated',pauseIfPlaying);}catch(e){}
  try{if(tgv('6.9'))TG.CloudStorage.getItem('dues_meta',(err,v)=>{try{const m=JSON.parse(v||'null');if(!err&&m&&typeof m.bank==='number'&&(m.t||0)>META.t){META.bank=m.bank;META.owned=[...new Set([...FREE,...(m.owned||[]).filter(k=>m.v>=2||k!=='witch')])];META.t=m.t;localStorage.setItem(META_KEY,JSON.stringify(META));if(ov==='menu')showMenu();else if(ov==='select')showSelect(false);}}catch(e){}});}catch(e){}
  try{if(tgv('6.9'))TG.CloudStorage.getItem('dues_best',(err,v)=>{if(!err&&v&&+v>best){best=+v;try{localStorage.setItem('dues.best',best);}catch(e){}if(ov==='menu')showMenu();}});}catch(e){}
}
setInterval(syncTG,150);
boot();

})();
</script>
